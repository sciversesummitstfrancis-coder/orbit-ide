[package]
name = "orbit-ide"
version = "0.1.0"
description = "ORBIT IDE — Your code. Your environment. Your orbit."
authors = ["ORBIT"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
git2 = { version = "0.19", features = [] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1"
parking_lot = "0.12"
walkdir = "2"
regex = "1"
which = "7"
portablepty = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"